CONFIG_I2C=y
CONFIG_INPUT_PINNACLE=y
CONFIG_ZMK_INPUT_SPLIT=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# The Pinnacle work item runs on the system work queue and blocks on a full input queue, while
# Bluetooth frees its TX slots on that same queue. Three slots and 16 events deadlocked it.
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
