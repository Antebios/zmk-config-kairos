CONFIG_ZMK_INPUT_SPLIT=y
CONFIG_KAIROS44_STATUS_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_KAIROS44_HOST_TELEMETRY=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# The input thread runs the display's trackpad callback (snprintf) and every input listener; 512 B
# overflowed silently, because stack protection is off, and stalled the right half's Bluetooth link.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024